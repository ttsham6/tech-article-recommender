name: Build

on:
  pull_request:
    paths:
      - ".github/actions/build-python-zip/**"
      - ".github/actions/setup-aws/**"
      - ".github/workflows/build.yaml"
      - "agent/**"
      - "api/**"
      - "batch/**"
      - "frontend-web/**"
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build AI Agent project
        uses: ./.github/actions/build-python-zip
        with:
          work-dir: ./agent
          zip-name: strands-runtime.zip
          artifact-name: strands-runtime
          extra-copy-paths: main.py

  api-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build API project
        uses: ./.github/actions/build-python-zip
        with:
          work-dir: ./api
          zip-name: api-lambda.zip
          artifact-name: api-lambda

  batch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build batch project
        uses: ./.github/actions/build-python-zip
        with:
          work-dir: ./batch
          zip-name: rss-batch.zip
          artifact-name: rss-batch
          only-binary: "false"

  pulumi-aws-preview:
    needs: [agent-build, api-build, batch-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup and run Pulumi (AWS)
        uses: ./.github/actions/setup-aws
        with:
          command: preview
          stack-name: ttsham6/tech-article-recommender-infra/prod
          work-dir: "./infra"
          download-artifacts: "true"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  web-build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: ./frontend-web

      - name: Build web project
        run: yarn build
        working-directory: ./frontend-web
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tech-article-recommender
          entryPoint: ./frontend-web
