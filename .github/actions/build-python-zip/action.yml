name: Build Python Zip
description: "Setup Python and uv, build deployment zip, and upload artifact"

inputs:
  work-dir:
    description: "Working directory for the Python project"
    required: true
  zip-name:
    description: "Output zip file name"
    required: true
  artifact-name:
    description: "Uploaded GitHub artifact name"
    required: true
  python-version:
    description: "Python version"
    required: false
    default: "3.13"
  extra-copy-paths:
    description: "Whitespace-separated extra paths to copy into build/package"
    required: false
    default: ""
  only-binary:
    description: "Pass --only-binary=:all: to uv pip install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.0.1

    - name: Build zip artifact
      shell: bash
      working-directory: ${{ inputs.work-dir }}
      run: |
        rm -rf build/package build/dist "build/${{ inputs.zip-name }}"
        mkdir -p build/package
        uv build --wheel --out-dir build/dist
        ONLY_BINARY_ARGS=""
        if [ "${{ inputs.only-binary }}" = "true" ]; then
          ONLY_BINARY_ARGS="--only-binary=:all:"
        fi
        uv pip install \
          --python-platform aarch64-manylinux2014 \
          --python-version "${{ inputs.python-version }}" \
          --target build/package \
          $ONLY_BINARY_ARGS \
          build/dist/*.whl

        if [ -n "${{ inputs.extra-copy-paths }}" ]; then
          cp -R ${{ inputs.extra-copy-paths }} build/package/
        fi

        (
          cd build/package
          zip -r "../${{ inputs.zip-name }}" .
        )

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.work-dir }}/build/${{ inputs.zip-name }}
        if-no-files-found: error
