[project]
name = "tech-article-recommender-backend"
version = "0.1.0"
description = "Managed AgentCore harness client for tech article recommendations"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "strands-agents>=1.20.0",
]

[project.scripts]
recommend-articles = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
