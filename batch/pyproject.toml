[project]
name = "tech-article-recommender-batch"
version = "0.1.0"
description = "Scheduled Lambda for converting RSS feeds into knowledge base documents"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.34.0",
  "beautifulsoup4>=4.12.0",
  "feedparser>=6.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
