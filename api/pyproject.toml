[project]
name = "tech-article-recommender-api"
version = "0.1.0"
description = "FastAPI BFF for AgentCore runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
  "boto3>=1.34.0",
  "fastapi>=0.116.0",
  "mangum>=0.19.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
