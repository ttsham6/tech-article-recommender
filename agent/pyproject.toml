[project]
name = "tech-article-recommender-agent"
version = "0.1.0"
description = "Managed AgentCore harness client for tech article recommendations"
requires-python = ">=3.13,<3.14"
dependencies = [
  "bedrock-agentcore>=0.1.0",
  "boto3>=1.34.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "strands-agents>=1.20.0",
]

[project.scripts]
recommend-articles = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
